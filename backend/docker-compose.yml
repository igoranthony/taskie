services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskie
      POSTGRES_USER: taskie
      POSTGRES_PASSWORD: taskie
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskie -d taskie"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app:Z
    environment:
      - DEBUG=True
      - SECRET_KEY=taskie-secret-key-dev-only
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DB_NAME=taskie
      - DB_USER=taskie
      - DB_PASSWORD=taskie
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python /app/manage.py migrate &&
             python /app/seed.py &&
             python /app/manage.py runserver 0.0.0.0:8000"
    stdin_open: true
    tty: true

volumes:
  db_data:
