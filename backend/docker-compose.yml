version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tradex
      POSTGRES_USER: tradex
      POSTGRES_PASSWORD: tradex
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app:Z
    environment:
      - DEBUG=True
      - SECRET_KEY=tradex-secret-key-dev-only
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DB_NAME=tradex
      - DB_USER=tradex
      - DB_PASSWORD=tradex
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    command: >
      sh -c "python /app/manage.py migrate &&
             python /app/seed.py &&
             python /app/manage.py runserver 0.0.0.0:8000"
    stdin_open: true
    tty: true

volumes:
  db_data:
